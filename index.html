<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Properties</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Inline styles removed, will be loaded from style.css -->
</head>
<body>
    <header>
        <h1>Find Your Dream Property</h1>
    </header>

    <nav>
        <button onclick="fetchProperties('all')">All Properties</button>
        <button onclick="fetchProperties('sale')">For Sale</button>
        <button onclick="fetchProperties('rent')">For Rent</button>
    </nav>

    <div class="container">
        <div id="property-listings" class="property-listings">
            <!-- Properties will be loaded here by JavaScript -->
            <div class="loader">Loading properties...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Real Estate Listings</p>
    </footer>

    <script>
        const listingsContainer = document.getElementById('property-listings');
        let allProperties = []; // To store all fetched properties for client-side filtering

        async function fetchProperties(filter = 'all') {
            listingsContainer.innerHTML = '<div class="loader">Loading properties...</div>'; // Show loader
            try {
                const response = await fetch('/api/properties');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allProperties = await response.json();
                renderProperties(filter);
            } catch (error) {
                listingsContainer.innerHTML = `<p style="color: red;">Error loading properties: ${error.message}</p>`;
                console.error('Failed to fetch properties:', error);
            }
        }

        function renderProperties(filter = 'all') {
            listingsContainer.innerHTML = ''; // Clear previous listings or loader

            const filteredProperties = filter === 'all'
                ? allProperties
                : allProperties.filter(prop => prop.status.toLowerCase() === filter);

            if (filteredProperties.length === 0) {
                listingsContainer.innerHTML = '<p>No properties found matching your criteria.</p>';
                return;
            }

            filteredProperties.forEach(property => {
                const card = document.createElement('div');
                card.className = 'property-card';

                let imagePath = property.image_url;
                // Adjust image path if it's coming from static folder reference
                if (imagePath && imagePath.startsWith('static/')) {
                    // Create a valid URL for the image
                    // Assuming Flask serves static files from '/static/' route
                     imagePath = `/${imagePath}`;
                } else if (imagePath) {
                    // If it's an absolute URL or different path structure, use as is
                    // This might need adjustment based on how images are actually served/stored
                } else {
                    imagePath = '/static/images/default_placeholder.png'; // A generic placeholder
                }


                card.innerHTML = `
                    <img src="${imagePath}" alt="${property.name || 'Property Image'}" onerror="this.onerror=null;this.src='/static/images/default_placeholder.png';">
                    <h3>${property.name}</h3>
                    <p>${property.description}</p>
                    <p class="price">$${property.price.toLocaleString()}</p>
                    <p class="status ${property.status.toLowerCase()}">${property.status.charAt(0).toUpperCase() + property.status.slice(1)}</p>
                `;
                listingsContainer.appendChild(card);
            });
        }

        // Initial load of all properties
        document.addEventListener('DOMContentLoaded', () => fetchProperties());
    </script>
</body>
</html>
